<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>IDS Monitoring Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .metric-card { transition: all 0.3s ease; }
        .anomaly-danger { background-color: #f8d7da; border-color: #f5c2c7; }
    </style>
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="mb-4">IDS Real-Time Monitor</h1>

    <!-- Dynamiczny kontener na karty sond sieciowych -->
    <div id="sensors-container">
        <div class="alert alert-info text-center">Oczekiwanie na strumień danych z sond sieciowych...</div>
    </div>

    <!-- Sekcja Incydentów (Wspólna, poniżej wszystkich sond) -->
    <div class="mt-5 p-4 border rounded bg-white shadow-sm">
        <h4 class="mb-3 text-secondary d-flex justify-content-between align-content-center">
            <span>Historia Incydentów i Forensics</span>
            <span class="badge bg-secondary font-monospace" id="incident-count" style="font-size: 1rem;">0</span>
        </h4>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>Czas wykrycia</th>
                    <th>ID Incydentu</th>
                    <th>Opis / Wyzwalacz</th>
                    <th>Max Prawdopodobieństwo</th>
                    <th>Analiza Wireshark</th>
                </tr>
                </thead>
                <tbody id="incidents-table-body">
                <tr>
                    <td colspan="5" class="text-center text-muted py-3">Brak zarejestrowanych incydentów. System jest bezpieczny.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const eventSource = new EventSource("/dashboard/stream");

    eventSource.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const container = document.getElementById('sensors-container');

        let totalSensorsHtml = '';

        // Iterujemy po każdej sondzie w otrzymanej mapie
        Object.keys(data).forEach(sensorId => {
            const sensorData = data[sensorId];
            const prob = sensorData.anomalyProbability || 0;

            let barClass = 'bg-primary';
            let badgeClass = 'bg-success';
            let statusText = 'MONITORING / LEARNING';
            let cardBorder = '';

            if (prob > 60) {
                barClass = 'bg-danger progress-bar-striped progress-bar-animated';
                badgeClass = 'bg-danger';
                statusText = 'ATTACK DETECTED';
                cardBorder = 'border-danger';
            }

            // Generowanie mikro-kart Z-Score dla tej konkretnej sondy
            let gridHtml = '';
            Object.keys(sensorData).forEach(key => {
                if (key === 'anomalyProbability') return;

                const val = sensorData[key];
                const isAnomaly = Math.abs(val) > 3.0;
                const alertClass = isAnomaly ? 'border-danger text-danger' : 'border-light';
                const bgClass = isAnomaly ? 'bg-danger-subtle' : 'bg-white';

                gridHtml += `
                    <div class="col-md-4 col-lg-2 mb-3">
                        <div class="card h-100 shadow-sm ${alertClass} ${bgClass} metric-card">
                            <div class="card-body text-center p-2">
                                <div class="text-uppercase text-muted mb-1" style="font-size: 0.65rem; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                                    ${key.replace(/_/g, ' ')}
                                </div>
                                <div class="h5 mb-0 fw-bold font-monospace">
                                    ${val.toFixed(3)}
                                </div>
                                <small class="text-muted" style="font-size: 0.7rem;">Z-Score</small>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Składanie całej sekcji dla pojedynczego segmentu sieci
            totalSensorsHtml += `
                <div class="card mb-4 shadow-sm border-0 ${cardBorder}">
                    <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center py-3">
                        <h5 class="m-0 font-monospace">Segment sieci (Sonda IP): ${sensorId}</h5>
                        <span class="badge ${badgeClass}">${statusText}</span>
                    </div>
                    <div class="card-body bg-white p-4">
                        <div class="row align-items-center mb-4">
                            <div class="col-md-3">
                                <span class="text-muted small d-block">Prawdopodobieństwo anomalii</span>
                                <span class="h3 fw-bold m-0">${prob.toFixed(2)}%</span>
                            </div>
                            <div class="col-md-9">
                                <div class="progress" style="height: 22px;">
                                    <div class="progress-bar ${barClass}" role="progressbar" style="width: ${prob}%"></div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            ${gridHtml}
                        </div>
                    </div>
                </div>
            `;
        });

        if (Object.keys(data).length > 0) {
            container.innerHTML = totalSensorsHtml;
        } else {
            container.innerHTML = '<div class="alert alert-warning text-center">Brak podłączonych sond. Uruchom dumpcap na maszynach monitorujących.</div>';
        }
    };

    function refreshIncidents() {
        fetch('/dashboard/incidents')
            .then(response => response.json())
            .then(incidents => {
                const tbody = document.getElementById('incidents-table-body');
                document.getElementById('incident-count').innerText = incidents.length;

                if (incidents.length === 0) return;

                let html = '';
                incidents.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));

                incidents.forEach(inc => {
                    const date = new Date(inc.timestamp).toLocaleTimeString();
                    html += `
                    <tr>
                        <td class="font-monospace">${date}</td>
                        <td><small class="text-muted">${inc.id.substring(0,8)}...</small></td>
                        <td><span class="fw-semibold">${inc.description}</span></td>
                        <td>
                            <span class="badge bg-danger">${inc.maxProbability.toFixed(1)}%</span>
                        </td>
                        <td>
                            <a href="/dashboard/incidents/${inc.id}/pcap" class="btn btn-sm btn-outline-primary d-inline-flex align-items-center">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-download me-1" viewBox="0 0 16 16">
                                  <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/>
                                  <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708z"/>
                                </svg> Pobierz PCAP
                            </a>
                        </td>
                    </tr>
                `;
                });
                tbody.innerHTML = html;
            });
    }

    setInterval(refreshIncidents, 5000);
    refreshIncidents();
</script>
</body>
</html>
