<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDS Dashboard - Sensory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .metric-card { transition: all 0.3s ease; }
  </style>
</head>
<body class="bg-light">

<!-- Górne Menu Nawigacyjne -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">IDS Monitor</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="/dashboard">Alerty</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active fw-bold" href="/sensors">Sensory</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/metadata">Metadane Assetów</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container pb-5">
  <h3 class="mb-4 text-secondary">Podłączone Sondy i Metryki Sieciowe</h3>

  <div id="sensors-container">
    <div class="alert alert-info text-center" id="initial-loader">Oczekiwanie na strumień danych z sond sieciowych...</div>
  </div>
</div>

<script>
  const charts = {};
  const sensorMetadataCache = {};

  // Pobieranie metadanych z konfiguracji backendu
  async function fetchMetadata() {
    try {
      const res = await fetch('/dashboard/configuration/sensors');
      if (res.ok) {
        const sensors = await res.json();
        sensors.forEach(s => {
          sensorMetadataCache[s.id] = s;
        });
      }
    } catch (e) {
      console.error("Błąd podczas pobierania metadanych sensorów:", e);
    }
  }

  // Odświeżamy metadane co 30 sekund
  fetchMetadata();
  setInterval(fetchMetadata, 30000);

  const eventSource = new EventSource("/dashboard/stream");

  eventSource.onmessage = (event) => {
    const data = JSON.parse(event.data);
    const container = document.getElementById('sensors-container');
    const loader = document.getElementById('initial-loader');

    if (loader) loader.remove();

    const sensorIds = Object.keys(data);

    if (sensorIds.length === 0) {
      if (!document.getElementById('no-sensors-alert')) {
        container.innerHTML = '<div id="no-sensors-alert" class="alert alert-warning text-center">Brak podłączonych sond. Uruchom dumpcap na maszynach monitorujących.</div>';
      }
      return;
    }

    const noSensorsAlert = document.getElementById('no-sensors-alert');
    if (noSensorsAlert) noSensorsAlert.remove();

    sensorIds.forEach(sensorId => {
      const sensorData = data[sensorId];
      const safeId = sensorId.replace(/\./g, '_');
      const cardId = `sensor-card-${safeId}`;
      const prob = sensorData.anomalyProbability || 0;
      const meta = sensorMetadataCache[sensorId] || {};

      let barClass = 'bg-primary';
      let badgeClass = 'bg-success';
      let statusText = 'MONITORING / LEARNING';
      let cardBorder = '';

      if (prob > 60) {
        barClass = 'bg-danger progress-bar-striped progress-bar-animated';
        badgeClass = 'bg-danger';
        statusText = 'ATTACK DETECTED';
        cardBorder = 'border-danger';
      }

      // Jeśli karta dla sensora nie istnieje, twórzmy jej strukturę jednorazowo
      if (!document.getElementById(cardId)) {
        const cardHtml = `
          <div class="card mb-4 shadow-sm ${cardBorder}" id="${cardId}">
              <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                  <div>
                      <h5 class="m-0 font-monospace d-inline">Sonda: ${sensorId}</h5>
                      <span class="ms-3 text-light small font-monospace" id="meta-${safeId}">
                          ${meta.name ? `| ${meta.name} (${meta.hostname || ''}) - ${meta.location || ''}` : ''}
                      </span>
                  </div>
                  <span class="badge ${badgeClass}" id="badge-${safeId}">${statusText}</span>
              </div>
              <div class="card-body bg-white p-4">
                  <div class="row align-items-center mb-4">
                      <div class="col-md-3">
                          <span class="text-muted small d-block">Prawdopodobieństwo anomalii</span>
                          <span class="h3 fw-bold m-0" id="prob-text-${safeId}">${prob.toFixed(2)}%</span>
                      </div>
                      <div class="col-md-9">
                          <div class="progress" style="height: 22px;">
                              <div class="progress-bar ${barClass}" id="prob-bar-${safeId}" role="progressbar" style="width: ${prob}%"></div>
                          </div>
                      </div>
                  </div>
                  <div class="row mb-4" id="metrics-grid-${safeId}"></div>
                  <div class="p-3 bg-light rounded border">
                      <h6 class="text-muted mb-3">Interaktywny wykres metryk i anomalii (Na żywo)</h6>
                      <canvas id="chart-${safeId}" style="max-height: 250px;"></canvas>
                  </div>
              </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHtml);
      } else {
        // Aktualizacja nagłówków i pasków bez przebudowy DOM
        const badge = document.getElementById(`badge-${safeId}`);
        badge.className = `badge ${badgeClass}`;
        badge.innerText = statusText;

        const probText = document.getElementById(`prob-text-${safeId}`);
        probText.innerText = `${prob.toFixed(2)}%`;

        const probBar = document.getElementById(`prob-bar-${safeId}`);
        probBar.className = `progress-bar ${barClass}`;
        probBar.style.width = `${prob}%`;

        const metaSpan = document.getElementById(`meta-${safeId}`);
        if (meta.name) {
          metaSpan.innerText = `| ${meta.name} (${meta.hostname || ''}) - ${meta.location || ''}`;
        }
      }

      // Aktualizacja kafelków Z-Score
      const metricsGrid = document.getElementById(`metrics-grid-${safeId}`);
      let gridHtml = '';
      Object.keys(sensorData).forEach(key => {
        if (key === 'anomalyProbability') return;
        const val = sensorData[key];
        const isAnomaly = Math.abs(val) > 3.0;
        const alertClass = isAnomaly ? 'border-danger text-danger' : 'border-light';
        const bgClass = isAnomaly ? 'bg-danger-subtle' : 'bg-white';

        gridHtml += `
          <div class="col-md-4 col-lg-2 mb-3">
              <div class="card h-100 shadow-sm ${alertClass} ${bgClass} metric-card">
                  <div class="card-body text-center p-2">
                      <div class="text-uppercase text-muted mb-1" style="font-size: 0.65rem; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${key}">
                          ${key.replace(/_/g, ' ')}
                      </div>
                      <div class="h5 mb-0 fw-bold font-monospace">
                          ${val.toFixed(3)}
                      </div>
                      <small class="text-muted" style="font-size: 0.7rem;">Z-Score</small>
                  </div>
              </div>
          </div>
        `;
      });
      metricsGrid.innerHTML = gridHtml;

      // Obsługa wieloliniowego Wykresu Chart.js (Anomaly % + 6 Metryk)
      const chartId = `chart-${safeId}`;
      const ctx = document.getElementById(chartId);
      const currentTime = new Date().toLocaleTimeString();

      if (ctx && !charts[chartId]) {
        charts[chartId] = new Chart(ctx, {
          type: 'line',
          data: {
            labels: [currentTime],
            datasets: [
              {
                label: 'Anomalia (%)',
                data: [prob],
                borderColor: '#dc3545',
                backgroundColor: 'rgba(220, 53, 69, 0.1)',
                borderWidth: 3,
                yAxisID: 'yProb',
                tension: 0.2
              },
              {
                label: 'Metryka 1 (Z-Score)',
                data: [],
                borderColor: '#0d6efd',
                borderDash: [5, 5],
                borderWidth: 1.5,
                yAxisID: 'yZScore',
                tension: 0.2
              },
              {
                label: 'Metryka 2 (Z-Score)',
                data: [],
                borderColor: '#198754',
                borderDash: [5, 5],
                borderWidth: 1.5,
                yAxisID: 'yZScore',
                tension: 0.2
              },
              {
                label: 'Metryka 3 (Z-Score)',
                data: [],
                borderColor: '#ffc107',
                borderDash: [5, 5],
                borderWidth: 1.5,
                yAxisID: 'yZScore',
                tension: 0.2
              },
              {
                label: 'Metryka 4 (Z-Score)',
                data: [],
                borderColor: '#0dcaf0',
                borderDash: [5, 5],
                borderWidth: 1.5,
                yAxisID: 'yZScore',
                tension: 0.2
              },
              {
                label: 'Metryka 5 (Z-Score)',
                data: [],
                borderColor: '#6f42c1',
                borderDash: [5, 5],
                borderWidth: 1.5,
                yAxisID: 'yZScore',
                tension: 0.2
              },
              {
                label: 'Metryka 6 (Z-Score)',
                data: [],
                borderColor: '#fd7e14',
                borderDash: [5, 5],
                borderWidth: 1.5,
                yAxisID: 'yZScore',
                tension: 0.2
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: {
              yProb: {
                type: 'linear',
                display: true,
                position: 'left',
                beginAtZero: true,
                max: 100,
                title: { display: true, text: 'Prawdopodobieństwo (%)' }
              },
              yZScore: {
                type: 'linear',
                display: true,
                position: 'right',
                grid: { drawOnChartArea: false },
                title: { display: true, text: 'Wartości Z-Score' }
              }
            }
          }
        });
      } else if (charts[chartId]) {
        const chart = charts[chartId];

        // Dodajemy nową etykietę czasową i utrzymujemy ostatnie 20 punktów
        chart.data.labels.push(currentTime);
        if (chart.data.labels.length > 20) chart.data.labels.shift();

        // Linia 0: Prawdopodobieństwo Anomalii
        chart.data.datasets[0].data.push(prob);
        if (chart.data.datasets[0].data.length > 20) chart.data.datasets[0].data.shift();

        // Linie 1..6: dynamiczne przypisanie metryk Z-Score ze strumienia
        const metricKeys = Object.keys(sensorData).filter(k => k !== 'anomalyProbability');
        metricKeys.slice(0, 6).forEach((key, index) => {
          const dsIndex = index + 1;
          if (chart.data.datasets[dsIndex]) {
            chart.data.datasets[dsIndex].label = key.replace(/_/g, ' ');
            chart.data.datasets[dsIndex].data.push(sensorData[key]);
            if (chart.data.datasets[dsIndex].data.length > 20) {
              chart.data.datasets[dsIndex].data.shift();
            }
          }
        });

        chart.update();
      }
    });
  };
</script>
</body>
</html>
