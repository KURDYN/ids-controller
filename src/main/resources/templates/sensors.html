<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDS Dashboard - Sensory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Chart.js i wtyczki do czasu, zoomu oraz przesuwania wykresu -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

  <style>
    .metric-card { transition: all 0.3s ease; }
  </style>
</head>
<body class="bg-light">

<!-- Górne Menu Nawigacyjne -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">IDS Monitor</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="/dashboard">Alerty</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active fw-bold" href="/sensors">Sensory</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/metadata">Metadane Assetów</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container pb-5">
  <h3 class="mb-4 text-secondary">Podłączone Sondy i Metryki Sieciowe</h3>

  <div id="sensors-container">
    <div class="alert alert-info text-center" id="initial-loader">Oczekiwanie na strumień danych z sond sieciowych...</div>
  </div>
</div>

<script>
  const charts = {};
  const sensorMetadataCache = {};

  async function fetchMetadata() {
    try {
      const res = await fetch('/dashboard/configuration/sensors');
      if (res.ok) {
        const sensors = await res.json();
        sensors.forEach(s => { sensorMetadataCache[s.id] = s; });
      }
    } catch (e) {
      console.error("Błąd podczas pobierania metadanych sensorów:", e);
    }
  }

  fetchMetadata();
  setInterval(fetchMetadata, 30000);

  // Inicjalizacja wykresu dla wskazanego sensora i załadowanie 24h historii
  async function initChart(sensorId, safeId) {
    const chartId = `chart-${safeId}`;
    const ctx = document.getElementById(chartId);
    if (!ctx || charts[chartId]) return;

    charts[chartId] = new Chart(ctx, {
      type: 'line',
      data: {
        datasets: [
          { label: 'Anomalia (%)', data: [], borderColor: '#dc3545', backgroundColor: 'rgba(220, 53, 69, 0.1)', borderWidth: 2.5, yAxisID: 'yProb', tension: 0.1, pointRadius: 0 },
          { label: 'SYNS PER SEC', data: [], borderColor: '#0d6efd', borderDash: [4, 4], borderWidth: 1.2, yAxisID: 'yZScore', tension: 0.1, pointRadius: 0 },
          { label: 'ICMPS PER SEC', data: [], borderColor: '#198754', borderDash: [4, 4], borderWidth: 1.2, yAxisID: 'yZScore', tension: 0.1, pointRadius: 0 },
          { label: 'AVG PACKET SIZE', data: [], borderColor: '#ffc107', borderDash: [4, 4], borderWidth: 1.2, yAxisID: 'yZScore', tension: 0.1, pointRadius: 0 },
          { label: 'TRAFFIC ASYMMETRY', data: [], borderColor: '#0dcaf0', borderDash: [4, 4], borderWidth: 1.2, yAxisID: 'yZScore', tension: 0.1, pointRadius: 0 },
          { label: 'ACTIVE FLOWS', data: [], borderColor: '#6f42c1', borderDash: [4, 4], borderWidth: 1.2, yAxisID: 'yZScore', tension: 0.1, pointRadius: 0 },
          { label: 'GLOBAL PORT DIVERSITY', data: [], borderColor: '#fd7e14', borderDash: [4, 4], borderWidth: 1.2, yAxisID: 'yZScore', tension: 0.1, pointRadius: 0 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        scales: {
          x: {
            type: 'time',
            time: { unit: 'minute', displayFormats: { minute: 'HH:mm' } },
            title: { display: true, text: 'Czas' }
          },
          yProb: {
            type: 'linear', display: true, position: 'left', beginAtZero: true, max: 100, title: { display: true, text: 'Prawdopodobieństwo (%)' }
          },
          yZScore: {
            type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Wartości Z-Score' }
          }
        },
        plugins: {
          zoom: {
            pan: { enabled: true, mode: 'x' },
            zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' }
          }
        }
      }
    });

    // Wczytanie historii 24h z REST API
    try {
      const res = await fetch(`/dashboard/history/${encodeURIComponent(sensorId)}`);
      if (res.ok) {
        const history = await res.json();
        const chart = charts[chartId];

        history.forEach(item => {
          const t = item.timestamp;
          chart.data.datasets[0].data.push({ x: t, y: item.anomalyProbability });
          chart.data.datasets[1].data.push({ x: t, y: item.zSyn });
          chart.data.datasets[2].data.push({ x: t, y: item.zIcmp });
          chart.data.datasets[3].data.push({ x: t, y: item.zAvgSize });
          chart.data.datasets[4].data.push({ x: t, y: item.zAsym });
          chart.data.datasets[5].data.push({ x: t, y: item.zFlows });
          chart.data.datasets[6].data.push({ x: t, y: item.zPortVar });
        });

        chart.update('none');
      }
    } catch (e) {
      console.error("Błąd podczas pobierania historii wykresu:", e);
    }
  }

  function resetZoom(chartId) {
    if (charts[chartId]) {
      charts[chartId].resetZoom();
    }
  }

  const eventSource = new EventSource("/dashboard/stream");

  eventSource.onmessage = (event) => {
    const data = JSON.parse(event.data);
    const container = document.getElementById('sensors-container');
    const loader = document.getElementById('initial-loader');
    if (loader) loader.remove();

    const sensorIds = Object.keys(data);
    if (sensorIds.length === 0) return;

    sensorIds.forEach(sensorId => {
      const sensorData = data[sensorId];
      const safeId = sensorId.replace(/\./g, '_');
      const cardId = `sensor-card-${safeId}`;
      const prob = sensorData.anomalyProbability || 0;
      const meta = sensorMetadataCache[sensorId] || {};

      let barClass = 'bg-primary';
      let badgeClass = 'bg-success';
      let statusText = 'MONITORING / LEARNING';
      let cardBorder = '';

      if (prob > 60) {
        barClass = 'bg-danger progress-bar-striped progress-bar-animated';
        badgeClass = 'bg-danger';
        statusText = 'ATTACK DETECTED';
        cardBorder = 'border-danger';
      }

      if (!document.getElementById(cardId)) {
        const cardHtml = `
          <div class="card mb-4 shadow-sm ${cardBorder}" id="${cardId}">
              <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                  <div>
                      <h5 class="m-0 font-monospace d-inline">Sonda: ${sensorId}</h5>
                      <span class="ms-3 text-light small font-monospace" id="meta-${safeId}">
                          ${meta.name ? `| ${meta.name} (${meta.hostname || ''}) - ${meta.location || ''}` : ''}
                      </span>
                  </div>
                  <span class="badge ${badgeClass}" id="badge-${safeId}">${statusText}</span>
              </div>
              <div class="card-body bg-white p-4">
                  <div class="row align-items-center mb-4">
                      <div class="col-md-3">
                          <span class="text-muted small d-block">Prawdopodobieństwo anomalii</span>
                          <span class="h3 fw-bold m-0" id="prob-text-${safeId}">${prob.toFixed(2)}%</span>
                      </div>
                      <div class="col-md-9">
                          <div class="progress" style="height: 22px;">
                              <div class="progress-bar ${barClass}" id="prob-bar-${safeId}" role="progressbar" style="width: ${prob}%"></div>
                          </div>
                      </div>
                  </div>
                  <div class="row mb-4" id="metrics-grid-${safeId}"></div>
                  <div class="p-3 bg-light rounded border">
                      <div class="d-flex justify-content-between align-items-center mb-3">
                          <h6 class="text-muted m-0">Interaktywny wykres aktywności (24h)</h6>
                          <button class="btn btn-sm btn-outline-secondary" onclick="resetZoom('chart-${safeId}')">Przywróć widok</button>
                      </div>
                      <div style="position: relative; height: 260px;">
                        <canvas id="chart-${safeId}"></canvas>
                      </div>
                  </div>
              </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHtml);
        initChart(sensorId, safeId);
      } else {
        const badge = document.getElementById(`badge-${safeId}`);
        badge.className = `badge ${badgeClass}`;
        badge.innerText = statusText;

        const probText = document.getElementById(`prob-text-${safeId}`);
        probText.innerText = `${prob.toFixed(2)}%`;

        const probBar = document.getElementById(`prob-bar-${safeId}`);
        probBar.className = `progress-bar ${barClass}`;
        probBar.style.width = `${prob}%`;

        const metaSpan = document.getElementById(`meta-${safeId}`);
        if (meta.name) {
          metaSpan.innerText = `| ${meta.name} (${meta.hostname || ''}) - ${meta.location || ''}`;
        }
      }

      // Aktualizacja kafelków Z-Score
      const metricsGrid = document.getElementById(`metrics-grid-${safeId}`);
      let gridHtml = '';
      Object.keys(sensorData).forEach(key => {
        if (key === 'anomalyProbability') return;
        const val = sensorData[key];
        const isAnomaly = Math.abs(val) > 3.0;
        const alertClass = isAnomaly ? 'border-danger text-danger' : 'border-light';
        const bgClass = isAnomaly ? 'bg-danger-subtle' : 'bg-white';

        gridHtml += `
          <div class="col-md-4 col-lg-2 mb-3">
              <div class="card h-100 shadow-sm ${alertClass} ${bgClass} metric-card">
                  <div class="card-body text-center p-2">
                      <div class="text-uppercase text-muted mb-1" style="font-size: 0.65rem; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${key}">
                          ${key.replace(/_/g, ' ')}
                      </div>
                      <div class="h5 mb-0 fw-bold font-monospace">${val.toFixed(3)}</div>
                      <small class="text-muted" style="font-size: 0.7rem;">Z-Score</small>
                  </div>
              </div>
          </div>
        `;
      });
      metricsGrid.innerHTML = gridHtml;

      // Aktualizacja danych w czasie rzeczywistym na istniejącym wykresie
      const chartId = `chart-${safeId}`;
      const chart = charts[chartId];
      if (chart) {
        const now = Date.now();

        chart.data.datasets[0].data.push({ x: now, y: prob });
        chart.data.datasets[1].data.push({ x: now, y: sensorData['SYNS_PER_SEC'] || 0 });
        chart.data.datasets[2].data.push({ x: now, y: sensorData['ICMPS_PER_SEC'] || 0 });
        chart.data.datasets[3].data.push({ x: now, y: sensorData['AVG_PACKET_SIZE'] || 0 });
        chart.data.datasets[4].data.push({ x: now, y: sensorData['TRAFFIC_ASYMMETRY'] || 0 });
        chart.data.datasets[5].data.push({ x: now, y: sensorData['ACTIVE_FLOWS'] || 0 });
        chart.data.datasets[6].data.push({ x: now, y: sensorData['GLOBAL_PORT_DIVERSITY'] || 0 });

        // Utrzymywanie bufora do 86 400 wpisów (24 godziny)
        chart.data.datasets.forEach(ds => {
          if (ds.data.length > 86400) ds.data.shift();
        });

        chart.update('none');
      }
    });
  };
</script>
</body>
</html>
