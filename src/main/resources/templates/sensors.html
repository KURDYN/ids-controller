<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDS Dashboard - Sensory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .metric-card { transition: all 0.3s ease; }
  </style>
</head>
<body class="bg-light">

<!-- Górne Menu Nawigacyjne -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">IDS Monitor</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="/dashboard">Alerty</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active fw-bold" href="/sensors">Sensory</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/metadata">Metadane Assetów</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container pb-5">
  <h3 class="mb-4 text-secondary">Podłączone Sondy i Metryki Sieciowe</h3>

  <!-- Dynamiczny kontener na karty sond sieciowych -->
  <div id="sensors-container">
    <div class="alert alert-info text-center">Oczekiwanie na strumień danych z sond sieciowych...</div>
  </div>
</div>

<script>
  const eventSource = new EventSource("/dashboard/stream");
  const charts = {};

  eventSource.onmessage = (event) => {
    const data = JSON.parse(event.data);
    const container = document.getElementById('sensors-container');

    let totalSensorsHtml = '';

    Object.keys(data).forEach(sensorId => {
      const sensorData = data[sensorId];
      const prob = sensorData.anomalyProbability || 0;

      let barClass = 'bg-primary';
      let badgeClass = 'bg-success';
      let statusText = 'MONITORING / LEARNING';
      let cardBorder = '';

      if (prob > 60) {
        barClass = 'bg-danger progress-bar-striped progress-bar-animated';
        badgeClass = 'bg-danger';
        statusText = 'ATTACK DETECTED';
        cardBorder = 'border-danger';
      }

      let gridHtml = '';
      Object.keys(sensorData).forEach(key => {
        if (key === 'anomalyProbability') return;

        const val = sensorData[key];
        const isAnomaly = Math.abs(val) > 3.0;
        const alertClass = isAnomaly ? 'border-danger text-danger' : 'border-light';
        const bgClass = isAnomaly ? 'bg-danger-subtle' : 'bg-white';

        gridHtml += `
                    <div class="col-md-4 col-lg-2 mb-3">
                        <div class="card h-100 shadow-sm ${alertClass} ${bgClass} metric-card">
                            <div class="card-body text-center p-2">
                                <div class="text-uppercase text-muted mb-1" style="font-size: 0.65rem; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                                    ${key.replace(/_/g, ' ')}
                                </div>
                                <div class="h5 mb-0 fw-bold font-monospace">
                                    ${val.toFixed(3)}
                                </div>
                                <small class="text-muted" style="font-size: 0.7rem;">Z-Score</small>
                            </div>
                        </div>
                    </div>
                `;
      });

      totalSensorsHtml += `
                <div class="card mb-4 shadow-sm border-0 ${cardBorder}">
                    <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center py-3">
                        <h5 class="m-0 font-monospace">Segment sieci (Sonda IP): ${sensorId}</h5>
                        <span class="badge ${badgeClass}">${statusText}</span>
                    </div>
                    <div class="card-body bg-white p-4">
                        <div class="row align-items-center mb-4">
                            <div class="col-md-3">
                                <span class="text-muted small d-block">Prawdopodobieństwo anomalii</span>
                                <span class="h3 fw-bold m-0">${prob.toFixed(2)}%</span>
                            </div>
                            <div class="col-md-9">
                                <div class="progress" style="height: 22px;">
                                    <div class="progress-bar ${barClass}" role="progressbar" style="width: ${prob}%"></div>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-4">
                            ${gridHtml}
                        </div>
                        <div class="p-3 bg-light rounded border">
                            <h6 class="text-muted mb-3">Interaktywny wykres aktywności (24h)</h6>
                            <canvas id="chart-${sensorId.replace(/\./g, '_')}" style="max-height: 200px;"></canvas>
                        </div>
                    </div>
                </div>
            `;
    });

    if (Object.keys(data).length > 0) {
      container.innerHTML = totalSensorsHtml;

      // Inicjalizacja / aktualizacja wykresów dla każdego sensora
      Object.keys(data).forEach(sensorId => {
        const chartId = `chart-${sensorId.replace(/\./g, '_')}`;
        const ctx = document.getElementById(chartId);
        if (ctx && !charts[chartId]) {
          const now = new Date();
          const labels = Array.from({length: 24}, (_, i) => {
            const d = new Date(now.getTime() - (23 - i) * 3600000);
            return d.getHours() + ':00';
          });

          charts[chartId] = new Chart(ctx, {
            type: 'line',
            data: {
              labels: labels,
              datasets: [{
                label: 'Prawdopodobieństwo anomalii (%)',
                data: Array(23).fill(0).concat([data[sensorId].anomalyProbability || 0]),
                borderColor: '#0d6efd',
                backgroundColor: 'rgba(13, 110, 253, 0.1)',
                fill: true,
                tension: 0.3
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                y: { beginAtZero: true, max: 100 }
              }
            }
          });
        }
      });
    } else {
      container.innerHTML = '<div class="alert alert-warning text-center">Brak podłączonych sond. Uruchom dumpcap na maszynach monitorujących.</div>';
    }
  };
</script>
</body>
</html>
